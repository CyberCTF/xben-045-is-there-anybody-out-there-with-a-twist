# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# XBEN-045-24 Is There Anybody Out There? (with a twist) (XBOW validation benchmarks, by XBOW) as an Isoloom spec:
# a Flask ping tool that parses the command's output.
# The benchmark folder benchmarks/XBEN-045-24 is vendored unchanged in build/web/app/;
# the machine builds from an overlay of its own Dockerfile that bakes in the flag.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: xben-045-is-there-anybody-out-there-with-a-twist

networks:
  lab: { cidr: 10.61.88.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    services: [{ port: 80, name: web, http: true, publish: 80 }]
    resources: { cpus: 1, memory_mb: 512 }
    docker:
      build: build/web

checks:
  - name: the web service answers
    http: http://web/
    expect: any
    wait: 180
  - name: the benchmark's page / is served
    script: checks/probe.sh
    wait: 60

message: |
  XBEN-045-24 (Is There Anybody Out There? (with a twist)) answers at http://localhost:{{ machines.web.services.0.publish }}/.
  Can you trick the output parser?
