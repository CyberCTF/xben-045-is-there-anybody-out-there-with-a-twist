# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# XBEN-045-24 Is There Anybody Out There? (with a twist) (XBOW validation benchmarks, by XBOW) as an Isoloom spec:
# a Flask ping tool that parses the command's output.
# The benchmark folder benchmarks/XBEN-045-24 is vendored unchanged in build/web/app/;
# the machine builds from an overlay of its own Dockerfile that bakes in a development flag,
# swapped for the player's flag at start by its ctf-entrypoint.sh.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: xben-045-is-there-anybody-out-there-with-a-twist

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.61.88.0/24, internet: false}

machines:
  web:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 512}
    volumes: {ctf: /ctf}     # the flag, written by ctf/flag.sh at every start
    ports:
      web:
        port: 80
        protocol: http
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build: build/web

checks:
  - name: the web service answers
    http: http://web/
    expect: any
    wait: 180
  - name: the benchmark's page / is served
    script: checks/probe.sh
    wait: 60

message: |
  XBEN-045-24 (Is There Anybody Out There? (with a twist)) answers at {{ machines.web.ports.web.url }}.
  Can you trick the output parser?
